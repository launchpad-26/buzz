name: launchpad — corpus schema tests

# Runs the unit tests for launchpad/docs/corpus/schema/tests/*.py.
#
# WHY THIS WORKFLOW EXISTS. Mirrors launchpad-agents-tests.yml's pattern exactly, for
# the identical reason it was built: without a workflow like this one, no CI job runs
# these tests at all, and a passing suite nobody executes is a claim, not a check. It
# also declares this suite's one new dependency (jsonschema + PyYAML, see
# launchpad/docs/corpus/schema/requirements.txt) so an unrecorded import breaks CI
# rather than breaking the next person to clone the repo.
#
# `pull_request`, deliberately NOT `pull_request_target` — the suite under test lives
# in the repository, so a pull request can modify the very schema/fixtures this job
# checks. On `pull_request` that code executes with the fork's own permissions and no
# access to repository secrets. Same reasoning launchpad-agents-tests.yml documents.

on:
  pull_request:
    paths:
      - "launchpad/docs/corpus/schema/**"
      - ".github/workflows/launchpad-corpus-schema-tests.yml"
  push:
    branches: [launchpad]
    paths:
      - "launchpad/docs/corpus/schema/**"

# Read-only. These are pure unit tests against files checked into the repository: they
# reach no network, no relay, and no GitHub API, so they need no token scope.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install corpus schema test dependencies
        run: pip install -r launchpad/docs/corpus/schema/requirements.txt

      # Fails if the suite contains no test CASES, rather than reporting success for a
      # run that executed nothing. `unittest discover` exits 0 on an empty suite, which
      # is indistinguishable from a pass in the CI summary -- launchpad-agents-tests.yml
      # found this the hard way (a file-counting guard was tried first and missed a
      # rename-every-method regression); this counts cases, not files, for the same
      # reason.
      - name: Confirm test cases were discovered
        run: |
          python3 - <<'PY'
          import sys, unittest
          suite = unittest.defaultTestLoader.discover(
              "launchpad/docs/corpus/schema/tests", pattern="test_*.py"
          )
          n = suite.countTestCases()
          print(f"discovered {n} test case(s)")
          if n == 0:
              print("::error::launchpad/docs/corpus/schema/tests has no discoverable "
                    "test cases — this job would have passed vacuously.")
              sys.exit(1)
          PY

      - name: Run corpus schema unit tests
        run: python3 -m unittest discover -s launchpad/docs/corpus/schema/tests -p "test_*.py" -v
