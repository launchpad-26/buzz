name: launchpad — auto-add issues to Buzz delivery board

# Keeps the org-level Delivery board (project 20) in sync as issues are opened.
# Board write is attempted with the built-in GITHUB_TOKEN. NOTE: if the org-level
# Projects v2 board rejects this token ("Resource not accessible by integration"),
# the ADD step errors and this workflow fails loudly rather than silently dropping
# the issue — swap the token for a project-scoped PAT secret in that case.

on:
  issues:
    types: [opened, reopened, transferred]

permissions:
  issues: read

jobs:
  add-to-board:
    runs-on: ubuntu-latest
    steps:
      - name: Add issue to delivery board
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_ID: "PVT_kwDOEnEMsM4BflNQ"   # org project 20 "Buzz delivery"
          STATUS_FIELD_ID: "PVTSSF_lADOEnEMsM4BflNQzhZ3Gfo"  # "Status"
          BACKLOG_OPTION_ID: "f75ad846"        # Status = "Backlog"
        run: |
          python3 - <<'PY'
          import json, os, subprocess

          project_id = os.environ["PROJECT_ID"]
          field_id = os.environ["STATUS_FIELD_ID"]
          option_id = os.environ["BACKLOG_OPTION_ID"]

          repo = os.environ.get("GITHUB_REPOSITORY", "")
          number = os.environ.get("ISSUE_NUMBER", "")

          def gh(q):
              r = subprocess.run(["gh", "api", "graphql", "-f", f"query={q}"],
                                 capture_output=True, text=True)
              if r.returncode != 0:
                  raise SystemExit(f"gh api failed: {r.stderr}")
              return json.loads(r.stdout)

          # Resolve this issue's global node id (item id == issue id for issues).
          cid_url = f"repos/{repo}/issues/{number}"
          node = json.loads(subprocess.run(
              ["gh", "api", cid_url, "--jq", ".node_id"],
              capture_output=True, text=True, check=True).stdout.strip())

          # Idempotent: addProjectV2ItemById returns the existing item if already there.
          add = gh(
              f'mutation {{ addProjectV2ItemById(input:'
              f' {{ projectId: "{project_id}", contentId: "{node}" }})'
              f' {{ item {{ id }} }} }}')
          item_id = (add.get("data", {}).get("addProjectV2ItemById") or {}).get("item", {}).get("id")
          if not item_id:
              raise SystemExit(f"could not add issue to board: {json.dumps(add)}")

          # Set Status = Backlog only if it is currently unset, so we never override
          # a human's deliberate status change on a re-opened/edited issue.
          cur = gh(
              f'{{ node(id: "{item_id}")'
              f' {{ ... on ProjectV2Item'
              f' {{ fieldValueByName(name: "Status")'
              f' {{ ... on ProjectV2ItemFieldSingleSelectValue {{ name }} }}}} }} }}')
          current_status = (cur.get("data", {}).get("node", {})
                              .get("fieldValueByName", {}) or {}).get("name")

          if current_status in (None, "", "__NULL__"):
              gh(
                  f'mutation {{ updateProjectV2ItemFieldValue(input:'
                  f' {{ projectId: "{project_id}", itemId: "{item_id}",'
                  f' fieldId: "{field_id}",'
                  f' value: {{ singleSelectOptionId: "{option_id}" }}}})'
                  f' {{ projectV2Item {{ id }} }} }}')
              print(f"#{number}: added to board, Status -> Backlog")
          else:
              print(f"#{number}: already on board, Status = {current_status!r} (left as-is)")
          PY
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
