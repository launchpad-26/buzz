name: launchpad — skill tests

# WHAT THIS JOB DOES, PLAINLY. When a pull request changes anything under
# launchpad/skills/, GitHub runs the unit tests of each skill that
# launchpad/scripts/skill_test_floors.json says are run here, and marks the pull
# request red if any of them fail. It also fails when a skill's suite has shrunk
# below its recorded floor, and when a skill has landed that the manifest does
# not account for at all.
#
# WHAT IT DOES NOT DO. It does not review a pull request, read a diff, call a
# model, post a comment, create an issue, or approve anything. It runs test
# suites. It also does not run review-queue-automation's suite — that skill has
# its own workflow with its own floor and its own rationale, and the manifest
# records the exclusion by name so it cannot silently become untrue.
#
# WHY IT EXISTS (issue #2018). Six of the seven skills under launchpad/skills/
# shipped test suites that no CI job had ever executed. That was not theoretical:
# PR #1954 reached review with a genuinely red test in evidence-reduce — argparse
# rejected the documented `timeline --tz -07:00` form — while every check on the
# pull request was green, because no lane ran the test that was catching it. A
# human found it by hand in a worktree. This job is what should have found it.
#
# WHY PYTEST AND NOT UNITTEST, which is not a style preference. The suites do not
# share a layout. gh-admin/tests holds seven pytest-style bare `test_*` functions
# and no unittest.TestCase; under `unittest discover` it reports "Ran 0 tests" and
# exits 0 — seven controls silently uncounted, by exactly the mechanism the floor
# guard exists to catch. gh-admin/tests and software-change-impact-assessment/tests
# also lack __init__.py, so `unittest discover -t .` cannot import them at all.
# pytest collects every layout present, unittest.TestCase classes included.
#
# WHAT IT HONESTLY CANNOT DO. It proves these suites run and still contain what
# they contained when they were wired in. It does not prove they test the right
# things — #1954's suite was 82 tests strong and still shipped a red one that only
# a hand-run caught. A floor is a ratchet against erosion, not evidence of
# coverage.
#
# `pull_request`, deliberately NOT `pull_request_target` — the suites under test
# live in the repository, so a pull request can modify the very code this job
# runs. On `pull_request` that code executes with the fork's own permissions and
# no access to repository secrets. Mirrors launchpad-rqa-tests.yml and
# launchpad-agents-tests.yml.

on:
  pull_request:
    paths:
      - "launchpad/skills/**"
      - "launchpad/scripts/skill_test_floors.json"
      - "launchpad/scripts/skill_test_matrix.py"
      - ".github/workflows/launchpad-skill-tests.yml"
  push:
    branches: [launchpad]
    paths:
      - "launchpad/skills/**"
      - "launchpad/scripts/skill_test_floors.json"
      - "launchpad/scripts/skill_test_matrix.py"

# Read-only. These are pure unit tests against temp-directory fixtures: they
# reach no network, no relay and no GitHub API, so they need no token scope.
# Deliberately NOT given a GITHUB_TOKEN — a suite that only passes because the
# runner happened to hold a credential is a suite that is lying, and handing one
# over would hide that rather than fix it.
permissions:
  contents: read

jobs:
  # Runs BEFORE the suites and gates them. Its job is the failure mode a matrix
  # cannot report on its own: a skill nobody runs produces no matrix entry, so it
  # shows up as a green pipeline with one fewer job — indistinguishable from a
  # pass unless something counts. This counts.
  coverage:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.entries }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Every skill suite is accounted for
        run: python3 launchpad/scripts/skill_test_matrix.py check

      - id: matrix
        name: Build the suite matrix
        run: |
          echo "entries=$(python3 launchpad/scripts/skill_test_matrix.py matrix)" >> "$GITHUB_OUTPUT"

  tests:
    needs: coverage
    runs-on: ubuntu-latest
    strategy:
      # One red suite should not hide the state of the others. A reviewer needs
      # to know whether one skill broke or six did.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.coverage.outputs.matrix) }}
    name: ${{ matrix.skill }}
    defaults:
      run:
        working-directory: launchpad/skills/${{ matrix.skill }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # These skills import nothing outside the standard library, so pytest is
      # installed as a runner, not as a dependency of the code under test. If a
      # script ever grows a third-party import, collection below fails on the
      # import rather than a reader discovering it months later.
      - name: Install the test runner
        run: pip install "pytest==8.3.4"

      # Counts CASES, not files, and enforces the floor from the manifest. A
      # guard that counts files is satisfied by renaming every `test_*` function
      # to `check_*`: the files remain, zero cases are collected, and the run is
      # green. launchpad-agents-tests.yml records learning that the hard way.
      #
      # Collection errors are treated as failure rather than as a count, so a
      # module that no longer imports cannot pass by printing a number alongside
      # its error.
      - name: Confirm the suite still holds its test cases
        run: |
          set -o pipefail
          python3 -m pytest tests -q --collect-only 2>&1 \
            | tee /tmp/collect.txt \
            | tail -5
          python3 "$GITHUB_WORKSPACE/launchpad/scripts/skill_test_matrix.py" \
            assert-floor --skill "${{ matrix.skill }}" < /tmp/collect.txt

      - name: Run ${{ matrix.skill }} unit tests
        run: python3 -m pytest tests -q
