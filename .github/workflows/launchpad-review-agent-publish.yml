name: launchpad — review agent publish

# Posts (or updates) the single review comment #119's publish.py owns.
#
# This job HOLDS pull-requests: write, unlike launchpad-review-agent-controls.yml,
# which must not have it -- that is why this lives in a separate file rather than
# an added job there. The trigger below is deliberately not the plain event name
# that file uses: this job's write-capable token would otherwise be handed to a
# SAME-REPOSITORY pull request whose own diff can modify publish.py or
# check_publish_scope.py, the exact code this job then executes -- a PR could
# rewrite either to submit an APPROVE under the bot's identity, a hard violation
# of launchpad/AGENTS.md rule 1 ("Draft everything. Approve nothing."). The
# trigger below grants the base repository's token to every PR, fork or not, but
# actions/checkout defaults to the BASE ref when no `ref:` is given -- so the code
# that runs here is always what is committed on launchpad, never what the PR
# changed. No checkout step below may set `ref:` to anything derived from the
# pull request's head; doing so would recreate the exact vulnerability this
# trigger choice exists to close, now with the base repository's token instead of
# a fork's. The only untrusted PR content this job ever reads is the
# seven-or-eight-key document piped into publish.py on stdin below -- DATA,
# fetched over the API by the pipeline's earlier stages exactly as
# CONTAINMENT.md requires, never code checked out and executed.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# Nothing else, and no job below overrides this.
permissions:
  contents: read
  pull-requests: write

# Interpolates the pull request number so two pushes seconds apart cancel the
# stale run rather than racing it -- STEP 2's second find_existing call in
# publish.py is a backstop for the remaining race, not a substitute for this.
# A workflow-wide fixed group would be worse than none: every pull request would
# then cancel every other one's publish run.
concurrency:
  group: launchpad-review-agent-publish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      is-fork: ${{ steps.check.outputs.is-fork }}
    steps:
      - name: Check whether this pull request is cross-repository
        id: check
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "is-fork=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-fork=false" >> "$GITHUB_OUTPUT"
          fi

  # No cross-repository publication path is designed or built (see the plan's
  # LEFT OUT) -- this issue's own scope is launchpad-26/buzz pull requests, so a
  # fork PR is still skipped here, for a different reason than before: not
  # because the token would be unsafe (it no longer would be), but because
  # nothing downstream is built to handle one.
  publish:
    needs: guard
    if: needs.guard.outputs.is-fork != 'true'
    runs-on: ubuntu-latest
    # ONE literal, shared by both steps below via ${{ env.PUBLISH_LOGIN }} --
    # the publish step's --as and the verify step's PUBLISH_CONFIGURED_LOGIN
    # were previously two independent copies of "github-actions[bot]" with
    # nothing asserting they agreed. Moving #110's credential now means
    # changing this one line, not remembering to change it in two places
    # while the IDENTITY control silently verifies whichever copy it reads.
    env:
      PUBLISH_LOGIN: github-actions[bot]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      # #116 (pre-flight) is still an unmerged plan, not code -- #117 and #118
      # are ALREADY MERGED as code (run_dimensions.py, run_adjudication.py),
      # verified against their own --help rather than assumed from an earlier
      # revision's "unmerged plans" note, which was stale the moment #117
      # landed and went unchecked. run_dimensions.py takes the PR number as a
      # positional argument and fetches surfaces itself -- it reads nothing
      # from stdin, so there is no pre-flight stage to pipe from until #116
      # exists, and --list (a boolean flag that prints discovered slugs and
      # exits) is not a way to select which dimensions run; there isn't one
      # today -- every discovered dimension always runs. publish.py needs no
      # --repo flag -- Actions sets GITHUB_REPOSITORY for every run and it
      # falls back to that -- but run_dimensions.py has no such fallback: its
      # own default is a hardcoded "launchpad-26/buzz" (fetch.DEFAULT_REPO),
      # correct only by coincidence of matching this repo's own name. Passed
      # explicitly so a fork or a rename fetches and posts about the SAME
      # repository rather than silently reviewing this one while posting to
      # another.
      #
      # KNOWN GAP, disclosed rather than silently wrong: run_dimensions.py
      # emits no top-level `stages` key at all, and run_adjudication.py only
      # ever adds its OWN "adjudication" entry to whatever `stages` array
      # arrived -- so the merged document publish.py reads today never names
      # a dimension in `stages`, and STEP 5 condition (7) ("a dimension named
      # by the manifest produced no report") can never fire until #116 (or a
      # future revision of #117) actually populates dimension entries. This
      # is the same category of gap the plan itself names for the missing
      # pre-flight stage -- STEP 5's own text: "the stage manifest... is what
      # stands in for it" -- not yet dischargeable without #116.
      - name: Build the review document and publish
        id: publish
        working-directory: launchpad/review-agent
        env:
          GH_TOKEN: ${{ github.token }}
        # python3 on every stage: none of these scripts is executable or carries
        # a shebang (they open with a docstring, per this repo's own
        # convention -- every other invocation anywhere in the repo spells
        # this out too), and working-directory does not add itself to $PATH.
        # A bare `run_dimensions.py` here is "command not found", exit 127,
        # and the pipeline never runs on any real invocation.
        run: |
          python3 run_dimensions.py "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" |
          python3 run_adjudication.py |
          python3 publish.py --as "$PUBLISH_LOGIN"

      # The live half of the credential control: it must run under the token it
      # claims to measure, and this is the only workflow whose token is that one.
      # PUBLISH_OBSERVED_LOGIN crosses the step boundary via the prior step's
      # own $GITHUB_OUTPUT -- the live identity only exists inside that
      # process, off the POST/PUT response.
      - name: Verify the publish credential's live scope
        if: always()
        working-directory: launchpad/review-agent
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_CONFIGURED_LOGIN: ${{ env.PUBLISH_LOGIN }}
          PUBLISH_OBSERVED_LOGIN: ${{ steps.publish.outputs.author_login }}
        run: python3 check_publish_scope.py
