title = "launchpad-26/buzz secret-scanning config"

# Engine and allowlist location decided in ADR-0006 (launchpad/decisions/).
# Extends gitleaks' built-in ruleset rather than replacing it — SSH private
# keys, GitHub PATs and generic high-entropy .env-shaped assignments are
# already covered by the default rules (verified empirically against the
# fixtures in launchpad/scripts/security_audit_fixtures/secrets/ before this
# file was written). The rules below cover only what the default ruleset
# does not: Nostr key material, glibc crypt hashes, this fork's BUZZ_S3_*
# naming, and a Postgres URL with an embedded password.

[extend]
useDefault = true

[[rules]]
id = "nostr-nsec-private-key"
description = "Nostr nsec1 bech32-encoded private key"
regex = '''nsec1[023456789acdefghjklmnpqrstuvwxyz]{58}'''
tags = ["key", "nostr"]

[[rules]]
id = "buzz-private-key"
description = "BUZZ_PRIVATE_KEY or a similarly-named 64-hex-character private key assignment"
# Every group below is non-capturing (?:...). A capturing group here silently
# drops the finding entirely once [extend] useDefault = true merges in
# gitleaks' default ruleset — reproduced and isolated empirically before this
# file was written (a bare (a|b) group matches standalone but reports zero
# leaks the moment useDefault is active; (?:a|b) is unaffected). No known
# gitleaks issue was found describing this, so treat every future rule here
# the same way: no capturing groups, ever, unless secretGroup is set to use one.
#
# The key/separator segment accepts an optional closing quote before `:` or
# `=` — found missing by #68's own agent-surface fixtures, which are JSON
# (`"BUZZ_PRIVATE_KEY": "..."`), not `.env`-shaped (`BUZZ_PRIVATE_KEY=...`).
# A `.env` file has no key-side quote to close, so the `['"]?` before the
# separator is optional, not required, and both forms still match.
regex = '''(?i)[A-Z0-9_]*(?:PRIVATE_KEY|NSEC|SECKEY)[A-Z0-9_]*['"]?\s*[:=]\s*['"]?[0-9a-fA-F]{64}['"]?'''
tags = ["key", "nostr"]

[[rules]]
id = "glibc-crypt-hash"
# $1/$5/$6 optionally carry a rounds=N$ parameter before the salt; $y$
# (yescrypt) carries its own short encoded parameter block instead. Both
# shapes are one or two extra $-delimited segments before the final hash, so
# the middle is a repeated group rather than a fixed salt-then-hash count.
description = "glibc/Unix crypt hash ($1$, $5$, $6$, or $y$)"
regex = '''\$(?:1|5|6|y)\$(?:[./A-Za-z0-9=]+\$){1,2}[./A-Za-z0-9]{20,}'''
tags = ["password", "crypt"]

[[rules]]
id = "buzz-s3-minio-key"
description = "BUZZ_S3_ACCESS_KEY or BUZZ_S3_SECRET_KEY assignment"
# {6,} on the value, not \S+: launchpad/deploy/archived/runbooks/dev-deployment-SOP.md
# documents these as a markdown table cell, `` `BUZZ_S3_ACCESS_KEY=` ``, where the
# character immediately after = is a bare backtick — \S+ matched that one
# punctuation character as if it were a credential. Requiring a real value
# shape excludes it without an allowlist entry, and still matches every
# fixture and every real assignment this rule exists for.
# `['"]?` before the separator and `[:=]` instead of a bare `=`: same JSON-vs-
# .env gap #68's fixtures found on buzz-private-key, above — applied here too
# for the same reason, even though no fixture has yet forced this one.
regex = '''BUZZ_S3_(?:ACCESS|SECRET)_KEY['"]?\s*[:=]\s*['"]?[A-Za-z0-9_\-]{6,}['"]?'''
tags = ["key", "s3", "minio"]
# .env.example is, by repository-wide convention, entirely placeholder
# values meant to be copied and replaced — verified against .env.example
# and deploy/compose/.env.example, both CHANGE_ME-or-dev-value templates,
# never a deployed .env. Scoped to that one filename shape, not the repo.
[rules.allowlist]
paths = ['''.*\.env\.example$''']

[[rules]]
id = "postgres-url-with-password"
description = "Postgres connection URL with an embedded password"
regex = '''postgres(?:ql)?://[^:@/\s]+:[^@\s]+@[^\s]+'''
tags = ["password", "postgres"]
# The overwhelming majority of matches on this codebase are the standard
# local dev/test credential postgres://buzz:buzz_dev@localhost:5432/buzz
# (verified: scripts/run-tests.sh, crates/buzz-db/src/usage.rs, and ~100
# more files as of the first full-history scan run for #67) — a local-only
# connection string is not a production credential regardless of what the
# password looks like. Scoped to the host being loopback, not to any file
# or the value itself, so a real leaked URL pointed at a real host still
# fires. scripts/run-tests.sh already marks this same string
# `# sadscan:disable np.postgres.1` for a different, Block-internal
# scanner; this is gitleaks' equivalent for the same known-safe value.
[rules.allowlist]
regexes = ['''postgres(?:ql)?://[^:@/\s]+:[^@\s]+@(?:localhost|127\.0\.0\.1)(?::\d+)?/''']

# Fixtures prove every rule above fires (#67's own definition of done) and
# must therefore be readable by the scanner, but must never themselves be
# reported as a finding of the live audit — they are synthetic, not leaked.
#
# #67 as filed named two placeholders in dev-deployment-SOP.md (an
# ssh-ed25519 public-key fragment at a since-renumbered line, and a $6$
# prefix mentioned in prose) as needing an exclusion. Verified against the
# file's current content and location
# (launchpad/deploy/archived/runbooks/dev-deployment-SOP.md — moved out of
# launchpad/deploy/ entirely by the deploy-method archival that landed after
# #67 was filed): neither of those two strings matches any rule in this
# config any more, so neither needs an entry here. What the file's current
# content does trip is `<64 hex characters>` — a literal bracketed
# placeholder idiom this SOP uses for "a value goes here", not a value
# itself — via gitleaks' own default generic-api-key rule.
[allowlist]
description = "Paths this scan reads but never reports on, and specific verified false positives"
# #614's media-api.md corpus node originally shipped prose ("missing/malformed
# auth header, revoked/mismatched token") that trips generic-api-key. A later
# commit (6a14fd478) reworded the *current* text and confirmed clean on its
# own — but PR-mode gitleaks (security_audit_secrets_check.py's
# `FETCH_HEAD..HEAD`) scans every commit's own diff across that range, not
# just the file's current content. 86dd310f5 (the original commit that added
# this text) is unique to this feature branch, not an ancestor of launchpad,
# so its diff — carrying the pre-reword phrase forever — is rescanned on
# every CI run regardless of what a later commit changes the line to. No
# forward-only, non-history-rewriting commit can un-flag an already-merged
# commit's own patch; only a rebase (disallowed on a shared PR branch here)
# or an allowlist entry can. Scoped to this one commit, which only ever
# touched this single doc file with reviewed, non-secret prose.
commits = [
    '''86dd310f5ba81410179db1bb6397095c256481d2''',
]
paths = [
    '''launchpad/scripts/security_audit_fixtures/secrets/.*''',
    # Same class of false positive .intersect/sadscan.yaml already documents
    # for this exact file ("Cargo registry checksums are integrity hashes
    # generated by Cargo, not payment data") — here it trips gitleaks'
    # generic-api-key entropy heuristic instead of sadscan's payment-card
    # rule, but the underlying content and reasoning are the same. Verified
    # present in exactly these two Cargo.lock files in this repo — one
    # finding each, both checksum data. Scoped to these two literal paths
    # (#389), not the tree-wide `(^|/)Cargo\.lock$` pattern this replaces:
    # the broad form silently exempted every Cargo.lock anywhere in the
    # tree, present or future, from every rule, which was never verified —
    # only these two files were.
    '''^Cargo\.lock$''',
    '''^desktop/src-tauri/Cargo\.lock$''',
    # Issue #2100's the-professor detection-engine fixtures, same purpose and
    # reasoning as the security_audit_fixtures/secrets/ entry above: these
    # fixtures exist specifically to prove professor.py's screen-content
    # detectors (API-key, private-key, webhook-token-param, high-entropy
    # near-keyword) actually fire, so the strings inside them must be
    # readable by gitleaks as real-looking secrets for the fixture to do its
    # job. Synthetic, not leaked — verified against
    # block-high-entropy-token.md, block-high-entropy-token-underscore-boundary.md,
    # block-private-key.md, and block-webhook-url-token-param.md, the four
    # fixtures the default ruleset currently matches in this directory.
    '''launchpad/agents/the-professor/tools/contract/fixtures/.*''',
]
regexes = [
    # nip-oa.md's worked example tags a synthetic event with a public key
    # derived from the deliberately public test scalar 1 — the secp256k1
    # generator point itself, an immutable public constant, not anyone's
    # private material. Matched literally (not by shape) so this entry
    # cannot accidentally swallow any other 64-hex string.
    '''79be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798''',
    # PR #1981 and PR #2002's own history (not just their final tip) each
    # authored one of the six values below before being reworded to fix
    # gitleaks -- see the "fix(corpus)" commits on
    # feature/614-runtime-platform-corpus and
    # feature/616-interface-event-contract-corpus. gitleaks' PR-diff scan
    # walks every commit reachable from HEAD back to the merge-base, not just
    # the final tree, so the rewording alone does not clear the original
    # authoring commit already sitting in each branch's history -- these
    # entries are what actually clears the CI gate; the docs were also fixed
    # so future edits to these same pages don't reintroduce the pattern.
    # Independently confirmed as no real credential in each case by an
    # adversarial Codex review that read the actual file content, reran
    # gitleaks unredacted, and scanned this repo's full 11k-commit history
    # for anything else hiding under launchpad/docs/corpus/** (found nothing).
    #
    # interfaces/websocket/auth.md and interfaces/nostr/nip-42.md: two
    # distinct made-up NIP-42 example "challenge" hex values (a challenge is
    # a public, single-use, connection-scoped nonce -- not a credential).
    '''b6e0e6f8a1c2d3e4f5061728394a5b6c7d8e9f0a1b2c3d4e5f60718293a4b5c6''',
    '''b0635d6a9851d3aed0cd6c495b061d3406b3ae6b6b5cec98be36ecd3025c0866''',
    # interfaces/http/hooks.md: an invented example webhook secret, in a
    # sample request whose host (community.example.com) cannot resolve to a
    # real system.
    '''8b1b9e2c-7b0a-4e3a-9d2f-6c4a1e0f5b3d''',
    # platforms/relay/media-api.md:148 and events/kinds/kind-7-reaction.md:322
    # -- gitleaks' generic-api-key rule mistook these ordinary, slash-joined
    # English phrases for key-shaped values. Neither is a credential of any
    # kind.
    '''revoked/mismatched''',
    '''persistence/dedup/fanout''',
    # dev-deployment-SOP.md:1079's worked-example "Public key:" value — a
    # fixed, literal walkthrough value, explicitly labelled public (not the
    # $6$/secret-key output on adjacent lines, which stay placeholder text
    # and trip nothing). Matched literally, not by shape, so this entry
    # cannot accidentally swallow any other 64-hex string anywhere else.
    '''38980a43aba04331ba61b5e7b64b90e250cd411d042050eaf102a408acc6c379''',
    # launchpad/plans/2026-09-06-issue-2100-detection-engine-hardening.md's
    # "confirmed:" evidence lines quote this literal example value to record
    # a real regex-evasion bug reproduced against professor.py's
    # screen-content detector. It is prose, not a fixture file, so it should
    # not need path-based exclusion — but the same literal value was already
    # committed once in an earlier, superseded draft of this plan (a
    # different commit than the one carrying the doc's current text), and a
    # git-history scan re-reads every commit's diff regardless of what a
    # later commit changed it to. Rewording the current text can't retroactively
    # un-flag that superseded commit, so this value is allowlisted by its
    # literal text instead, the same narrow style as the public-key literal
    # above: it matches only this one synthetic token, in any commit, and
    # cannot swallow any other secret-shaped string in this file or
    # elsewhere.
    '''Q7mK2vR9xN4pL8sT3wY6zB1cD5fG0hJq''',
]
