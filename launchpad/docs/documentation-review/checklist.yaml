items:
  - id: "READER-001"
    category: "reader-first"
    requirement: "The document opens with a plain-language summary a non-specialist can read and understand in under 30 seconds."
    audience:
      - human
    applicability: "required"
    applies_when: "Always. Every document, every genre, no exceptions."
    priority_default: "P1"
    rationale: "Readers decide in seconds whether a document is for them, and a reader who cannot tell will either leave or — worse — act on a document meant for someone else. `R06` makes recognition a separate stage of the findability chain from retrieval: a document can be found and still be unusable because the reader cannot confirm it is the right one. `R13` makes it an accessibility requirement rather than a courtesy — readers working under interruption, time pressure, or with cognitive, language or reading differences need the point before the detail, not after it."
    evidence_required: "A summary at the very top, before any technical content, stating what the document is, who it is for, and what the reader should do with it — in plain words, using no jargon the summary does not itself define."
    suggested_locations: "The first block after the title, above everything else including tables of contents, status badges and metadata commentary."
    source_references: "`R06`, `R13`, `R01`; and the cohort's existing convention that a PR body opens with an \"In plain terms\" section above the machine-checked schema."
    corpus_gap: false
    audit_method: "Read only the summary, with a timer. Then state without scrolling: what is this, who is it for, what do I do next. If you cannot answer all three inside 30 seconds, the item fails. Do not grade your own document — an author always passes their own summary."
    automation_potential: "human"
    dependencies: []
    failure_risk: "The document serves only readers who already know what it contains, which is precisely the population that least needs it. Every other quality in this checklist becomes unreachable."
  - id: "READER-002"
    category: "reader-first"
    requirement: "The document contains a diagram of the thing it describes — the system, the flow, or the process — with an equivalent description in words."
    audience:
      - human
      - agent
    applicability: "required"
    applies_when: "The document describes something with parts, steps, states or relationships. A single-fact reference entry is exempt; almost nothing else is."
    priority_default: "P1"
    rationale: "`R10` is explicit that topology, sequence, containment and relationships are the information shapes prose carries worst, and that a reader who cannot see the shape reconstructs it wrongly. `R13` imposes the reverse obligation in the same breath: a diagram with no equivalent text route moves the information out of reach of some readers entirely. The diagram and its description are one requirement, not two."
    evidence_required: "A diagram — Mermaid preferred, because it is text, it diffs, and it renders on GitHub — showing the elements and their relationships, **plus** prose or a list conveying the same elements, relationships, order and conclusion."
    suggested_locations: "Immediately after the plain-language summary, before the detailed content."
    source_references: "`R10`, `R13`, `R02` G03."
    corpus_gap: false
    audit_method: "Two passes. Hide the prose: are the diagram's purpose, elements, relationship labels and direction clear, with a legend where the notation is not obvious (`ARCH-002`, `ARCH-003`)? Then hide the diagram: does the remaining text support the same conclusion (`HUMAN-010`)? Both must pass."
    automation_potential: "human"
    dependencies: ["READER-001"]
    failure_risk: "Structure and sequence exist only in the author's head. Readers rebuild them by guessing, and differently from one another — `F14`'s divergent mental models, arriving through the front door."
  - id: "FOUND-001"
    category: "foundations"
    requirement: "Each document identifies its intended reader and the reader's goal specifically enough to judge fitness — a bare role label is not sufficient."
    audience:
      - human
      - agent
    applicability: "required"
    applies_when: "Always."
    priority_default: "P1"
    rationale: "Relevance, completeness and usability cannot be judged without a named audience and task; ISO 9241-11 binds usability to specified users, goals and context."
    evidence_required: "A statement of audience and reader goal, or metadata plus opening prose that jointly make both recoverable."
    suggested_locations: "Front matter plus the document's opening."
    source_references: "`R01`, `R06`, `F11`."
    corpus_gap: false
    audit_method: "Read the opening cold. State the reader and the decision they are trying to make. If you cannot, the item fails."
    automation_potential: "human"
    dependencies: []
    failure_risk: "The document addresses everyone and serves no one — the measured default output of an agent that cannot observe the reader (`F11`)."
  - id: "FOUND-002"
    category: "foundations"
    requirement: "No document declares more audiences than it actually addresses."
    audience:
      - human
      - agent
    applicability: "required"
    applies_when: "The project has an audience field or equivalent."
    priority_default: "P2"
    rationale: "An audience field that is cheap to satisfy will be satisfied syntactically; declaring an extra audience costs nothing while excluding one requires an argument (`F11`)."
    evidence_required: "For each declared audience, a passage addressed to it."
    suggested_locations: "Front matter."
    source_references: "`F11`."
    corpus_gap: false
    audit_method: "Count declared audiences mechanically; for any document declaring ≥3, sample and check that each is genuinely addressed."
    automation_potential: "partial"
    dependencies: ["FOUND-001"]
    failure_risk: "Mode conflation and task disconnection hidden behind valid metadata."
  - id: "FOUND-003"
    category: "foundations"
    requirement: "Every document names the authority that governs its claims, and says when it is not itself authoritative."
    audience:
