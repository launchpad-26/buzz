      - agent
    applicability: "required"
    applies_when: "The document states requirements, defaults, or current system behaviour."
    priority_default: "P1"
    rationale: "Authority is not conferred by file location, confident tone, or capitalisation (`R09`)."
    evidence_required: "A named governing instrument, or an explicit statement that the document is explanatory and a link to what governs."
    suggested_locations: "Document header or a precedence section."
    source_references: "`R09`, `F09`."
    corpus_gap: false
    audit_method: "For each requirement-shaped sentence, ask which instrument imposed it. Unanswerable ⇒ fail."
    automation_potential: "human"
    dependencies: []
    failure_risk: "Invented obligations that read as policy."
  - id: "FOUND-004"
    category: "foundations"
    requirement: "Documents declare their source of truth for volatile facts, and link rather than restate bounded rule sets."
    audience:
      - human
      - agent
    applicability: "required"
    applies_when: "The document repeats a fact owned elsewhere."
    priority_default: "P1"
    rationale: "Restatement creates an independent maintenance site; the corpus demonstrates a case where a consistency guard propagated a wrong value into the document that was right (`F10`)."
    evidence_required: "A link to the owner, or a generation path."
    suggested_locations: "At the point of restatement."
    source_references: "`R05`, `F10`, `F14`."
    corpus_gap: false
    audit_method: "Grep for duplicated values (counts, versions, defaults) across documents; verify each duplicate against the owner, not against its sibling."
    automation_potential: "partial"
    dependencies: ["FOUND-003"]
    failure_risk: "Correction of the root does not propagate; the derived claim is where the harm lives."
  - id: "FOUND-005"
    category: "foundations"
    requirement: "Information architecture separates canonical nodes, classification, semantic relationships and reader journeys, and does not use one for another."
